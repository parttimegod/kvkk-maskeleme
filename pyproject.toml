[project]
name = "kvkk-maskeleme"
version = "0.3.0"
description = "Turkce metinlerde kisisel veri tespiti ve maskeleme (KVKK)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Emirhan Bahçacı" }]
requires-python = ">=3.11"
keywords = ["kvkk", "pii", "anonymization", "turkish", "privacy", "gdpr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Turkish",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Repository = "https://github.com/parttimegod/kvkk-maskeleme"
Issues = "https://github.com/parttimegod/kvkk-maskeleme/issues"

[project.scripts]
kvkk-maskeleme = "kvkk_maskeleme.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
